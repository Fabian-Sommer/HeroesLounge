<h3>Stats</h3>
Displaying stats of 
<form data-request="{{ __SELF__.alias }}::onSeasonChange" data-request-success="HLStatistics.initSlothTables()">
<select name="season_id">
  {% for season in __SELF__.participatedSeasons %}
  <option value="{{season.id}}"{% if __SELF__.selectedSeason.id==season.id%}selected="selected"{%endif%}>{{season.title}}</option>
  {% endfor %}
  <option value="-1" >all time</option>
</select>
<button type="submit">Update</button>
</form>
<br>
<div id="slothstatistics">
{%  partial '@stats' %}
</div>

{% put scripts %}
<script type="text/javascript">
    jQuery(function () { HLStatistics.initSlothTables(); });
</script>
{% endput %}
