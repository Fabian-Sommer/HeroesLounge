<div id="{{ __SELF__.alias }}_container">
    {% if __SELF__.loaded %}
        {% partial '@content' %}
    {% else %}
        <div class="text-center text-muted my-3"
            data-lazy-handler="{{ __SELF__.alias }}::onLoadStatistics"
            data-request-success="HLStatistics.initTeamTables()">Loading statistics…</div>
    {% endif %}
</div>
{% if __SELF__.loaded %}
{% put scripts %}
<script type="text/javascript">
    jQuery(function () { HLStatistics.initTeamTables(); });
</script>
{% endput %}
{% endif %}
